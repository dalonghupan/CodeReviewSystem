# job-scheduler 配置（开发环境样例）
server:
  http:
    network: tcp
    addr: 0.0.0.0:8006
    timeout: 5s
  grpc:
    network: tcp
    addr: 0.0.0.0:9006
    timeout: 5s

data:
  postgres:
    dsn: ${POSTGRES_DSN}
    read_dsn: ${POSTGRES_READ_DSN}
    max_open_conns: 10
    max_idle_conns: 3
    conn_max_lifetime: 30m
  redis:
    addr: ${REDIS_ADDR}
    password: ${REDIS_PASSWORD}
    db: 0
    dial_timeout: 3s
    read_timeout: 2s
    write_timeout: 2s

mq:
  name_servers:
    - ${ROCKETMQ_NAMESRV}
  consumer_group: GID_job_scheduler

trace:
  endpoint: ${OTEL_ENDPOINT}
  sample_ratio: 1.0
  insecure: true

logger:
  level: info
  development: true
