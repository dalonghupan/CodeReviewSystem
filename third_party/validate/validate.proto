syntax = "proto2";

package validate;

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/envoyproxy/protoc-gen-validate/validate";
option java_package = "io.envoyproxy.pgv.validate";

extend google.protobuf.FieldOptions {
  optional FieldRules rules = 1071;
}

message FieldRules {
  oneof type {
    FloatRules float = 1;
    DoubleRules double = 2;
    Int32Rules int32 = 3;
    Int64Rules int64 = 4;
    UInt32Rules uint32 = 5;
    UInt64Rules uint64 = 6;
    SInt32Rules sint32 = 7;
    SInt64Rules sint64 = 8;
    Fixed32Rules fixed32 = 9;
    Fixed64Rules fixed64 = 10;
    SFixed32Rules sfixed32 = 11;
    SFixed64Rules sfixed64 = 12;
    BoolRules bool = 13;
    StringRules string = 14;
    BytesRules bytes = 15;
    EnumRules enum = 16;
    MessageRules message = 17;
    RepeatedRules repeated = 18;
    MapRules map = 19;
  }
}

message FloatRules {
  optional float const = 1;
  optional float lt = 2;
  optional float lte = 3;
  optional float gt = 4;
  optional float gte = 5;
}

message DoubleRules {
  optional double const = 1;
  optional double lt = 2;
  optional double lte = 3;
  optional double gt = 4;
  optional double gte = 5;
}

message Int32Rules {
  optional int32 const = 1;
  optional int32 lt = 2;
  optional int32 lte = 3;
  optional int32 gt = 4;
  optional int32 gte = 5;
}

message Int64Rules {
  optional int64 const = 1;
  optional int64 lt = 2;
  optional int64 lte = 3;
  optional int64 gt = 4;
  optional int64 gte = 5;
}

message UInt32Rules { optional uint32 const = 1; optional uint32 lt = 2; optional uint32 lte = 3; optional uint32 gt = 4; optional uint32 gte = 5; }
message UInt64Rules { optional uint64 const = 1; optional uint64 lt = 2; optional uint64 lte = 3; optional uint64 gt = 4; optional uint64 gte = 5; }
message SInt32Rules { optional sint32 const = 1; optional sint32 lt = 2; optional sint32 lte = 3; optional sint32 gt = 4; optional sint32 gte = 5; }
message SInt64Rules { optional sint64 const = 1; optional sint64 lt = 2; optional sint64 lte = 3; optional sint64 gt = 4; optional sint64 gte = 5; }
message Fixed32Rules { optional fixed32 const = 1; optional fixed32 lt = 2; optional fixed32 lte = 3; optional fixed32 gt = 4; optional fixed32 gte = 5; }
message Fixed64Rules { optional fixed64 const = 1; optional fixed64 lt = 2; optional fixed64 lte = 3; optional fixed64 gt = 4; optional fixed64 gte = 5; }
message SFixed32Rules { optional sfixed32 const = 1; optional sfixed32 lt = 2; optional sfixed32 lte = 3; optional sfixed32 gt = 4; optional sfixed32 gte = 5; }
message SFixed64Rules { optional sfixed64 const = 1; optional sfixed64 lt = 2; optional sfixed64 lte = 3; optional sfixed64 gt = 4; optional sfixed64 gte = 5; }
message BoolRules { optional bool const = 1; }

message StringRules {
  optional string const = 1;
  optional uint64 len = 19;
  optional uint64 min_len = 2;
  optional uint64 max_len = 3;
  optional string prefix = 4;
  optional string suffix = 5;
  optional string contains = 6;
  optional string not_contains = 7;
  optional string pattern = 8;
  optional uint64 max_bytes = 18;
  optional bool email = 9;
  optional bool uuid = 13;
}

message BytesRules { optional bytes const = 1; optional uint64 len = 13; optional uint64 min_len = 2; optional uint64 max_len = 3; optional string pattern = 4; }
message EnumRules { optional int32 const = 1; repeated int32 in = 2; repeated int32 not_in = 3; }
message MessageRules { optional bool skip = 1; optional bool required = 2; }
message RepeatedRules { optional uint64 min_items = 1; optional uint64 max_items = 2; optional bool unique = 3; optional FieldRules items = 4; }
message MapRules { optional uint64 min_pairs = 1; optional uint64 max_pairs = 2; optional FieldRules keys = 4; optional FieldRules values = 5; }
