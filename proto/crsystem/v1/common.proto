syntax = "proto3";

package crsystem.v1;

import "google/protobuf/timestamp.proto";

option go_package = "cr-system/api/crsystem/v1;v1";

// 通用分页请求参数
message Pagination {
  uint32 page = 1;      // 当前页码，从1开始
  uint32 page_size = 2; // 每页条数，默认20，最大100
}

// 通用分页响应参数
message PaginationResp {
  uint32 total = 1;       // 总记录数
  uint32 page = 2;        // 当前页码
  uint32 page_size = 3;   // 每页条数
  uint32 total_pages = 4; // 总页数
}

// 评审单状态枚举（LLD §3.3 状态流转硬编码约束）
enum ReviewStatus {
  REVIEW_STATUS_UNSPECIFIED = 0;
  REVIEW_STATUS_PENDING = 1;          // 待评审
  REVIEW_STATUS_IN_PROGRESS = 2;      // 评审进行中
  REVIEW_STATUS_REJECTED = 3;         // 驳回待修改
  REVIEW_STATUS_RESUBMITTED = 4;      // 提交复审
  REVIEW_STATUS_APPROVED = 5;         // 复审通过
  REVIEW_STATUS_ARCHIVED = 6;         // 正式归档关闭
}

// 评审优先级
enum ReviewPriority {
  REVIEW_PRIORITY_UNSPECIFIED = 0;
  REVIEW_PRIORITY_LOW = 1;       // 低优先级
  REVIEW_PRIORITY_NORMAL = 2;    // 普通
  REVIEW_PRIORITY_HIGH = 3;      // 高优先级
  REVIEW_PRIORITY_URGENT = 4;    // 紧急
}

// 缺陷等级（SRS F02-03 / SQA §4.1）
enum DefectLevel {
  DEFECT_LEVEL_UNSPECIFIED = 0;
  DEFECT_LEVEL_FATAL = 1;      // 致命缺陷 P0
  DEFECT_LEVEL_CRITICAL = 2;   // 严重缺陷 P1
  DEFECT_LEVEL_MAJOR = 3;      // 一般缺陷 P2
  DEFECT_LEVEL_MINOR = 4;      // 优化建议 P3
}

// Git平台类型
enum GitPlatform {
  GIT_PLATFORM_UNSPECIFIED = 0;
  GIT_PLATFORM_GITLAB = 1;
  GIT_PLATFORM_GITEE = 2;
  GIT_PLATFORM_GITHUB = 3;
}

// 代码变更类型
enum DiffChangeType {
  DIFF_CHANGE_TYPE_UNSPECIFIED = 0;
  DIFF_CHANGE_TYPE_ADD = 1;     // 新增行
  DIFF_CHANGE_TYPE_DELETE = 2;  // 删除行
  DIFF_CHANGE_TYPE_MODIFY = 3;  // 修改行
}

// 通用操作结果
message OperateResult {
  bool success = 1;
  string message = 2;
}
