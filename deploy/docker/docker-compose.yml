# ============================================================
# CR-System 开发环境 docker-compose
# 启动：docker compose up -d
# 停止：docker compose down -v（删除数据卷）
# ============================================================

name: cr-system-dev

services:

  # ==================== 中间件 ====================

  postgres:
    image: postgres:17-alpine
    container_name: cr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: cr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: cr-rocketmq-namesrv
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m"
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "mqnamesrv"]
      interval: 10s
      timeout: 5s
      retries: 15

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: cr-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: ["sh", "mqbroker", "-c", "/etc/rocketmq/broker.conf"]
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./rocketmq/broker.conf:/etc/rocketmq/broker.conf
    healthcheck:
      test: ["CMD", "pgrep", "-f", "mqbroker"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    container_name: cr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO 初始化：创建 bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb local/cr-system-reports --ignore-existing &&
      echo 'MinIO bucket created'
      "

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cr-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317"
      - "16686:16686"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cr-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/cr_system
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8080
      KC_HTTPS_PORT: 8443
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== 微服务 ====================

  iam-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: iam-service
    container_name: cr-iam-service
    restart: unless-stopped
    env_file: .env
    command: ["./service", "-conf", "configs/iam-service.yaml"]
    ports:
      - "8001:8001"
      - "19001:9001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  git-adapter:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: git-adapter
    container_name: cr-git-adapter
    restart: unless-stopped
    env_file: .env
    command: ["./service", "-conf", "configs/git-adapter.yaml"]
    ports:
      - "8002:8002"
      - "9002:9002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cr-core:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: cr-core
    container_name: cr-cr-core
    restart: unless-stopped
    env_file: .env
    command: ["./service", "-conf", "configs/cr-core.yaml"]
    ports:
      - "8003:8003"
      - "9003:9003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      iam-service:
        condition: service_started
      git-adapter:
        condition: service_started

  message-push:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: message-push
    container_name: cr-message-push
    restart: unless-stopped
    env_file: .env
    command: ["./service", "-conf", "configs/message-push.yaml"]
    ports:
      - "8004:8004"
      - "9004:9004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy

  quality-stat:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: quality-stat
    container_name: cr-quality-stat
    restart: unless-stopped
    env_file: .env
    command: ["./service", "-conf", "configs/quality-stat.yaml"]
    ports:
      - "8005:8005"
      - "9005:9005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      minio:
        condition: service_healthy

  job-scheduler:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: job-scheduler
    container_name: cr-job-scheduler
    restart: unless-stopped
    env_file: .env
    command: ["./service", "-conf", "configs/job-scheduler.yaml"]
    ports:
      - "8006:8006"
      - "9006:9006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    container_name: cr-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - iam-service
      - cr-core

# ==================== 数据卷 ====================

volumes:
  pgdata:
  miniodata:
  brokerdata:
