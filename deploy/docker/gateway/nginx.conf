# ============================================================
# CR-System 开发环境 API 网关（nginx）
# 统一入口 :8000，按路径前缀路由到各微服务（正式环境由 APISIX 替代，见 O3）
# 路由表与 proto/crsystem/v1/*.proto 的 google.api.http 注解保持一致
# ============================================================

upstream iam_service   { server iam-service:8001; }
upstream git_adapter   { server git-adapter:8002; }
upstream cr_core       { server cr-core:8003; }
upstream message_push  { server message-push:8004; }
upstream quality_stat  { server quality-stat:8005; }
upstream job_scheduler { server job-scheduler:8006; }

server {
    listen 8000;
    server_name _;

    # ---- CORS（前端 http://localhost:3000 跨域调用） ----
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    add_header Vary "Origin" always;
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ---- 通用代理设置 ----
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # 网关自身健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ==================== iam-service :8001 ====================
    # /api/v1/auth/*、/api/v1/tenants*、/api/v1/users/*、/api/v1/roles/*、/api/v1/keycloak/*
    location /api/v1/auth/     { proxy_pass http://iam_service; }
    location /api/v1/keycloak/ { proxy_pass http://iam_service; }
    location /api/v1/users/    { proxy_pass http://iam_service; }
    location /api/v1/roles/    { proxy_pass http://iam_service; }

    # ==================== message-push :8004 ====================
    # 通知渠道挂在 tenants 路径下，须先于 /api/v1/tenants 匹配
    location ~ ^/api/v1/tenants/[^/]+/notification-channels {
        proxy_pass http://message_push;
    }
    location /api/v1/notifications { proxy_pass http://message_push; }

    # SSE 实时消息订阅（长连接：关缓冲、长超时）
    location /api/v1/sse/ {
        proxy_pass http://message_push;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    # ==================== iam-service：租户（其余） ====================
    location /api/v1/tenants { proxy_pass http://iam_service; }

    # ==================== git-adapter :8002 ====================
    location /api/v1/git/ { proxy_pass http://git_adapter; }

    # ==================== cr-core :8003 ====================
    location /api/v1/reviews       { proxy_pass http://cr_core; }
    location /api/v1/webhooks/git  { proxy_pass http://cr_core; }

    # ==================== quality-stat :8005 ====================
    location /api/v1/defects  { proxy_pass http://quality_stat; }
    location /api/v1/quality/ { proxy_pass http://quality_stat; }

    # ==================== job-scheduler :8006 ====================
    location /api/v1/jobs { proxy_pass http://job_scheduler; }

    # 未匹配路径
    location / {
        return 404 '{"code":404,"reason":"NOT_FOUND","message":"gateway: route not found"}';
    }
}
